# ```yaml
title: Aditya
description: >-
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.

baseurl: ""
url: ""

github_username: abhushna01

# Build settings
plugins:
  - jekyll-feed

# ✅ Ensure all pages use default layout (for global CSS)
defaults:
  - scope:
      path: ""
    values:
      layout: default

# ✅ SCSS configuration
sass:
  sass_dir: assets/styles
  style: compressed # options: nested, expanded, compact, compressed

# Optional: include assets folder explicitly (usually not required)
include:
  - assets

# Exclude from processing.
# exclude:
#   - node_modules/
# ```
